name: CI

on: [push, pull_request]

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Lint with Rubocop
        run: |
          bundle install
          bundle exec rubocop
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake
  docs-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Verify docs coverage
        run: |
          bundle install
          bundle exec rake docs:coverage
  tests-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Verify all rules have test coverage
        run: |
          bundle install
          bundle exec rake tests:coverage
